<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=Allura&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --color-light: #E1D7CD;
        --color-mid: #AD9277;
        --color-dark: #231F20;
      }

      * {
        box-sizing: border-box; 
      }

      body {
        background: var(--color-mid); 
        background-image: url("images/clean-gray-paper.png");
        background-repeat: repeat;
        font-family: 'Aleo', sans-serif; 
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Allura', cursive;
      }
      
      .container {
        perspective: 800px;
        color: var(--color-dark);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .card {
        width: 700px;
        height: 400px;
        background: var(--color-light);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.16), 0 3px 6px rgba(0, 0, 0, 0.23);  
        transform-style: preserve-3d;
        transition: 0.6s; 
        border-radius: 10px;
      }

      .side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        transform: rotate(0deg) translateZ(1px);
        border-radius: 10px;
      }

      .container:hover .card, .back {
        transform: rotateY(-180deg) translateZ(1px);
      }

      .front {
        text-align: center;
        background: var(--color-light);
        background-image: url("images/green-dust-and-scratches.png");
        background-repeat: repeat;
      }

      .logo {
        position: relative;
        padding: auto;
        margin-top: 150px;
        margin-bottom: 5px;
        font-size: 3.75em;
        font-weight: 500;
        font-style: italic;
      }

      .tagline {
        position: relative;
        padding: auto;
        margin-top: 0;
        margin-bottom: 0;
        font-size: 1.2em;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 300;
      }

      .back {
        background: var(--color-dark);
        background-image: url("images/green-dust-and-scratches.png");
        background-repeat: repeat;
        padding: 30px;
      }

      .name {
        color: var(--color-light);
        margin-bottom: 0;
        font-size: 2.5em;
        font-weight: 500;
      }

      .company {
        color: var(--color-light);
        margin-top: 0;
        font-size: 1.25em;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .info {
        position: absolute;
        bottom: 30px;
        right: 30px;
        color: var(--color-light);
        text-align: right;
        font-size: 0.8em;
        line-height: 1em;
        letter-spacing: 1px;
      }

      p {
        margin: .5em 0;
        padding: 0;
      }

      @media (max-width:700px) {
        .card { transform: scale(.5); }
        .container:hover .card { transform: scale(.5) rotateY(-180deg) translateZ(1px); }
      }

    </style>

    <!-- Validation -->
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <!-- classes, ids, and divs used for styling and scripting -->
    <main>
      <div class="container">
  <div class="card">
    
    <div class="front side">
      <h1 class="logo">McRoffis Designs</h1>
      <p class="tagline">Deep-Rooted Design</p>
    </div>
    
    <div class="back side">
      <h3 class="name">Angela McCrary-Roffis</h3>
      <p class="company">McRoffis Designs</p>      
      <div class="info">
        <p>1201 Elizabeth Ave, Charlotte, NC 28204</p>
        <p>mcroffis.pro@gmail.com</p>
        <p>amcroffis.com</p>
        <p>github.com/amcrare</p>
      </div>
    </div>
    
  </div>
</div>
    </main>
  </body>
</html>
