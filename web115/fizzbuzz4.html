<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angela McCrary-Roffis's Adventurous Musk Rat &#10051; WEB115 &#10051; Fizz Buzz 4</title>

    <link rel="icon" type="image/svg" href="images/favicon.svg" />

    <link rel="stylesheet" type="text/css" href="styles/default.css" />
    <link rel="stylesheet" type="text/css" href="styles/fizzbuzzStyles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Validation -->
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div data-include="components/header.html"></div>
    <main>
      <h2>Fizz Buzz 4</h2>
      <!-- classes, ids, and divs used for styling and scripting -->
      <div class="logo-container">
        <picture>
          <source srcset="images/LogoDefault.svg" media="(prefers-color-scheme: light)" class="wordmark"/>
          <source srcset="images/LogoDarkMode.svg" media="(prefers-color-scheme: dark)" class="wordmark" />
          <img src="images/LogoDefault.svg" alt="McRoffis Designs Logo" class="wordmark"/>
        </picture>
        <h3>McRoffis Designs Fizz Buzz</h3>
      </div>
      <section>
        <h4 id="greeting">Welcome to McRoffis Designs!</h4>
        <form id="name-entry">
          <fieldset>
            <legend class="sr-only">Enter your name:</legend>
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first-name" placeholder="John"/>
            <label for="middle-initial">Middle Initial:</label>
            <input type="text" id="middle-initial" name="middle-initial" maxlength="1" placeholder="J"/>
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last-name" placeholder="Doe"/>
          </fieldset>
          <button type="submit">Continue</button>
        </form>
      </section>
      <section id="number-entry">
        <h4 id="start-message">message here</h4>
        <form>
          <fieldset class="columns">
            <legend class="sr-only">Enter your numbers:</legend>
            <label for="count" class="envelope">Count to:
              <input type="number" id="count" name="count" placeholder="1" min="1" max="1000" value="125"/>
            </label>
            <label for="word0" class="envelope">Word for numbers not divisible by any divisor:
              <input type="text" id="word0" name="word0" placeholder="" value=""/>
            </label>
            <label for="divisor1" class="envelope">Divisor 1:
              <input type="number" id="divisor1" name="divisor1" placeholder="3" min="1" max="1000" required/>
            </label>
            <label for="word1" class="envelope">Word 1:
              <input type="text" id="word1" name="word1" placeholder="McRoffizz" value="McRoffizz"/>
            </label>
            <label for="divisor2" class="envelope">Divisor 2:
              <input type="number" id="divisor2" name="divisor2" placeholder="5" min="1" max="1000" required/>
            </label>
            <label for="word2" class="envelope">Word 2:
              <input type="text" id="word2" name="word2" placeholder="McRoffbuzz" value="McRoffbuzz"/>
            </label>
            <label for="divisor3" class="envelope">Divisor 3:
              <input type="number" id="divisor3" name="divisor3" placeholder="7" min="1" max="1000" required/>
            </label>
            <label for="word3" class="envelope">Word 3:
              <input type="text" id="word3" name="word3" placeholder="McRoffbang" value="McRoffbang"/>
            </label>
          </fieldset>
          <button type="submit">Count</button>
        </form>
      </section>
      <section id="results">
        <h4 id="results-message">message here</h4>
        <div id="output"></div>
        <button id="reset" type="button">Reset</button>
      </section>
    </main>
    <div data-include="components/footer.html"></div>

    <!-- Load game script -->
    <script src="scripts/fizzbuzz4.js"></script>
    
    <!-- Load header and footer using JavaScript -->
    <script src="scripts/includes.js"></script>
    
    <!-- Validation -->
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" data-mode="course" defer></script>
  </body>
</html>
